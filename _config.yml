      api: https://uapis.cn/api/v1/random/image?category=landscape
      # 背景图现在只在首页加载（其余页面 0 请求）。
      # 这里刻意没有 cache_ttl：这个 API 的图片无法被任何前端手段缓存，
      # 原因（含实测依据）见 themes/akari/source/js/api-image.js 顶部注释，
      # 想加缓存之前请先读那段。
      skip_on_save_data: true
