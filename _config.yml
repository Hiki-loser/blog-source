# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Hiki的小站
subtitle: 记录生活与技术
description: 分享后端开发、ACG 文化和生活感悟
keywords:
  - 后端开发
  - ACG
  - 技术博客
  - 生活感悟
author: Hiki
author_description: 后端开发者 | ACG 爱好者
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://hiki-loser.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  # false so canonical/OG URLs read https://…/about/ rather than
  # https://…/about/index.html. Search engines treat those as different URLs,
  # and the trailing form is the one nobody links to.
  trailing_index: false
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: 技术
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
##
## 'date', not 'mtime'. File mtimes in a git-based workflow are checkout times,
## not edit times — 'mtime' made article:modified_time in the Open Graph tags
## and <lastmod> in sitemap.xml claim every post was modified at the moment of
## the last deploy. 'date' uses the post's own front-matter date, and still
## honours an explicit `updated:` if one is added later.
updated_option: 'date'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: akari

# Site search index (hexo-generator-searchdb).
#
# JSON rather than XML: smaller, no XML parsing, and no DOMParser dependency in
# older WebViews. The front-end dialog is js/search.js and fetches this only on
# first open, never on page load. The theme's own options for that dialog live
# under `akari.search` below.
search:
  path: search.json
  field: post
  # Full post content is needed for body-text matching. At this size (~15 posts)
  # the index is roughly 40 KB gzipped. Drop to false to search titles and tags
  # only if the site grows a lot.
  content: true
  format: json

# Subscription feed (hexo-generator-feed).
#
# The Atom feed IS the subscribe mechanism for a static site — deliberately no
# Follow.it / FeedBlitz / Mailchimp embed, which would be a third-party script
# that is slow or blocked in mainland China and would undo the work of moving
# off the Tailwind CDN.
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: false
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

