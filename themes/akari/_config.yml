# Akari theme defaults.
#
# This file is the single source of truth for every theme option. A site
# overrides any of them under the `akari:` key of its OWN _config.yml — that is
# what Hexo merges on top of this one (hexo/dist/hexo/index.js:
# `deepMerge(ctx.theme.config, ctx.config.theme_config)`).
#
# Before this file existed the defaults were a ~160 line object inside
# scripts/akari-config.js, and the site _config.yml carried a VERBATIM copy of
# the whole `ui:` block. Two copies of the same strings, one of which silently
# shadowed the other.
#
# ARRAYS ARE REPLACED, NOT MERGED. Supplying `nav` here overrides the whole
# list, so a site that wants to add one item must restate all of them. This is
# deliberate: a concatenating merge would make it impossible to REMOVE a default
# nav entry.
#
# Site metadata (title, subtitle, description, author, language) is deliberately
# absent: it falls back to the root _config.yml at runtime, so it cannot be a
# literal here. See akari_config() in scripts/akari-config.js.
site:
  keywords: []
  author_description: 保持热爱，奔赴山海
  avatar: /img/avatar.svg
nav:
  - name: 首页
    path: /
  - name: 归档
    path: /archives
  - name: 分类
    path: /categories
  - name: 标签
    path: /tags
  - name: 关于
    path: /about
social: {}
home:
  featured_count: 3
  intro_only: true
  daily_image:
    enable: true
    api: https://uapis.cn/api/v1/random/image?category=acg&type=pc
    alt_text: 每日 ACG 美图
    refresh: true
    timeout: 8000
    skip_on_save_data: true
  background_image:
    enable: true
    api: https://uapis.cn/api/v1/random/image?category=landscape
    skip_on_save_data: true
  stats:
    enable: true
dark_mode:
  enable: true
  default: auto
music:
  enable: false
  type: netease
  playlist_id: ''
  auto: false
  custom_html: ''
comment:
  enable: false
  type: giscus
  giscus:
    repo: ''
    repo_id: ''
    category: ''
    category_id: ''
  valine:
    appId: ''
    appKey: ''
  utterances:
    repo: ''
search:
  enable: true
  path: /search.json
  max_results: 20
stats:
  enable: false
  provider: vercount
  show_counts: true
  show_build_stats: true
footer:
  additional: ''
