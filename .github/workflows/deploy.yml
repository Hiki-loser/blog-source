name: Deploy Hexo Blog

on:
  push:
    branches:
      - main
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# The job pushes to an external repo using a PAT (secrets.GH_TOKEN),
# so the default GITHUB_TOKEN needs no write access here.
permissions:
  contents: read

# A newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # NOTE: deliberately `npm ci` against the committed lockfile, and
      # deliberately NOT `rm -rf node_modules package-lock.json && npm install`.
      # Re-resolving every dependency on every deploy means any upstream publish
      # silently changes the deployed site with no way to roll back.
      #
      # Do NOT set NODE_ENV=production anywhere in this workflow: it makes
      # `npm ci` skip devDependencies, and the CSS build (postcss) lives there.
      - name: Install dependencies
        run: npm ci

      # Unit tests for the theme's config helpers, taxonomy case-collision check
      # (which has already caught two real regressions: agent/Agent, java/Java),
      # and behaviour tests for the image loader. See package.json -> "check".
      - name: Run checks
        run: npm run check

      # The compiled stylesheet is committed so that deploying never depends on
      # a build step succeeding. That makes it possible to commit a source change
      # and forget to rebuild, so verify the artifact is current. Tailwind v3
      # output is deterministic for identical input, and .gitattributes
      # normalises to LF, so this is a byte-exact comparison.
      - name: Build CSS
        run: npm run build:css

      - name: Verify generated CSS is committed
        run: git diff --exit-code -- themes/akari/source/css/tailwind.css

      - name: Generate static files
        run: npx hexo clean && npx hexo generate

      # Moves Tailwind off the CDN (which generated utilities from the live DOM,
      # so nothing could be missed) onto a local build driven by `content` globs,
      # which can silently purge a class that lives outside those globs.
      - name: Verify no Tailwind class was purged
        run: node tools/verify-class-coverage.js public

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_TOKEN }}
          external_repository: Hiki-loser/Hiki-loser.github.io
          publish_branch: main
          publish_dir: ./public

          # Publishing to an external repo's Pages branch: the orphan
          # force-push is what guarantees deletions propagate.
          force_orphan: true

          commit_message: "deploy: rebuild site from source"
