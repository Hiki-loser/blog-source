version: 2
updates:
  # Actions were pinned at @v3 for years because this ecosystem was missing
  # from this file. Without it, major-version staleness is invisible.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Monthly + grouped on purpose: Hexo plugins occasionally publish breaking
  # majors, and a weekly stream of them just mixes noise into content commits.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch

    # Tailwind is pinned to v3 on purpose (see the NOTE ON VERSIONS in
    # tailwind.config.js). v4 drops `darkMode: 'class'`, moves the default
    # palette to OKLCH and renames a long list of utilities, and it moves the
    # PostCSS plugin out to `@tailwindcss/postcss` — so a major bump is not a
    # dependency refresh, it is a build break: PR #2 merged exactly that bump
    # and took the deploy down, because `postcss.config.js` requires the v3
    # plugin directly. Suppressing the PR makes the migration a decision
    # someone takes deliberately instead of a changelog line someone approves.
    ignore:
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
