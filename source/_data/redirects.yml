# Old URL -> new URL.
#
# Emitted as redirect stubs by themes/akari/scripts/redirects.js and excluded
# from sitemap.xml by themes/akari/scripts/seo.js. One line per move, in the same
# commit as the rename that caused it, so the two can never drift apart.
#
# Why these exist: a post's slug is its full source path under source/_posts, so
# renaming a file OR a directory changes its URL. Three posts were renamed to
# remove spaces and a typo from their paths; anyone who linked to or bookmarked
# the old address still lands on the right article.
#
# The old paths contain LITERAL SPACES, matching how Hexo wrote them to disk
# (".../design patterns1/index.html"). A browser requests "%20", the server
# decodes it back to a space and looks for exactly that path — so the stub has to
# be written with a real space here. Writing "%20" would create a file literally
# named percent-two-zero, which no decoded request would ever match.

# "design patterns1" -> "design-patterns"
- from: /2026/04/23/technology/back-end/design patterns1/
  to: /2026/04/23/technology/back-end/design-patterns/

# "computer science/" (directory) -> "computer-science/"
- from: /2026/04/22/technology/computer science/computer science-intro/
  to: /2026/04/22/technology/computer-science/computer-science-intro/

# "opreating system1" -> "operating-system" (typo), directory renamed too
- from: /2026/04/22/technology/computer science/opreating system1/
  to: /2026/04/22/technology/computer-science/operating-system/

# source/example.md was a leftover copy of the post scaffold that rendered a real
# page at /example.html. Deleted; send it home rather than 404.
- from: /example.html
  to: /
